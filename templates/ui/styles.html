<style>
/* CAMS / Institutional Workspace. Shared presentation; no business behaviour.
   Kept as a template partial to use the existing asset setup without settings changes. */
:root { --navy:#17324D; --ink:#1B2939; --muted:#526174; --action:#1D4E89; --line:#D9E1EA; --ground:#F4F6F9; --history:#7A5A1F; --error:#A3261B; --sidebar-width:248px; --banner-height:0px; }
* { box-sizing:border-box; }

.ui-icon { display:inline-block; flex:none; vertical-align:middle; }

.demo-banner p { margin:0; padding:8px 24px; text-align:center; }
.sidebar { position:fixed; left:0; top:var(--banner-height); bottom:0; width:var(--sidebar-width); background:var(--navy); color:#E2EBF4; display:flex; flex-direction:column; z-index:50; overflow-y:auto; }
.sidebar-brand { display:flex; align-items:center; padding:30px 24px; border-bottom:1px solid #36506A; }

#appointments th:last-child { width:190px; }

.message { border:1px solid var(--line); border-left:4px solid var(--action); border-radius:5px; background:#fff; padding:14px 18px; }
.message-error { border-left-color:var(--error); color:var(--error); background:#FFF6F4; }
.page-messages { display:grid; gap:10px; margin-bottom:24px; }

@page { margin:14mm; }
